<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="app.css">
  <title>SIMPLE INTEREST CALCULATOR</title>
</head>

<body>

  <h1>SIMPLE INTEREST CALCULATOR</h1>

  <div class="container">
    <form action="#">
      <div>
        <label for="principal">Principal Amount:
          <input type="number" name="principal" id="principal">
        </label>
      </div>

      <div>
        <label for="rate">Rate of Interest:
          <input type="number" name="rate" id="rate">
        </label>
      </div>

      <div>
        <label for="time in years"> Time In Years:
          <input type="number" name="time" id="time">
        </label>
      </div>

      <div>
        <button type="submit" class="submitBtn">Calculate Interest</button>
      </div>
    </form>
  </div>

  <script src="./app.js"></script>
</body>

</html>
